<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f9f9f9;
        }
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #dddddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <!-- Yêu cầu: Tiêu đề h1 nội dung "Danh sách sản phẩm" -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng chứa các cột: Tên sản phẩm, Giá, Số lượng -->
    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <!-- Yêu cầu: Thêm ít nhất 4 sản phẩm -->
        <tr>
            <td>Điện thoại iPhone 15</td>
            <td>22.990.000 đ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Laptop Dell Inspiron</td>
            <td>16.450.000 đ</td>
            <td>5</td>
        </tr>
        <tr>
            <td>Tai nghe Bluetooth Sony</td>
            <td>3.200.000 đ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Bàn phím cơ Logitech</td>
            <td>1.850.000 đ</td>
            <td>8</td>
        </tr>
    </table>

</body>
</html>

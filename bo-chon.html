<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Thực hành Bộ chọn CSS</title>
    <!-- Liên kết đến tệp CSS bên ngoài (đặt tên riêng biệt) -->
    <link rel="stylesheet" href="style-bo-chon.css">
</head>
<body>

    <!-- Yêu cầu: Tiêu đề h1 nội dung "Trang web của tôi" -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Yêu cầu: Một đoạn văn p mô tả bản thân -->
    <p class="description">Xin chào! Tôi là một học viên đang theo học lộ trình lập trình Web. Tôi đam mê khám phá công nghệ mới và đang nỗ lực làm chủ các kỹ năng Front-end.</p>

    <!-- Yêu cầu: Một danh sách ul liệt kê 3 sở thích -->
    <h2>Sở thích của tôi</h2>
    <ul class="hobby-list">
        <li class="hobby-item-1">Đọc sách công nghệ</li>
        <li class="hobby-item-2">Nghe nhạc không lời khi code</li>
        <li class="hobby-item-3">Đi du lịch khám phá</li>
    </ul>

    <!-- Yêu cầu: Một nút bấm button nội dung "Nhấn vào đây" -->
    <div style="margin-top: 25px;">
        <button type="button" class="btn-action">Nhấn vào đây</button>
    </div>

</body>
</html>

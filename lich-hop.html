<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lịch họp công ty</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
        }
        table {
            width: 100%;
            max-width: 700px;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: #ffffff;
        }
        .left-align {
            text-align: left;
        }
        tr:hover {
            background-color: #f1f2f6;
        }
    </style>
</head>
<body>

    <!-- Yêu cầu: Tiêu đề h1 nội dung "Lịch họp công ty" -->
    <h1>Lịch họp công ty</h1>

    <!-- Bảng hiển thị gồm các cột: Ngày, Giờ, Nội dung cuộc họp -->
    <table>
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>
        
        <!-- Ngày Thứ Hai có 2 cuộc họp -> Dùng rowspan="2" ở ô Ngày -->
        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 10:00</td>
            <td class="left-align">Họp giao ban đầu tuần toàn công ty</td>
        </tr>
        <tr>
            <td>14:00 - 16:00</td>
            <td class="left-align">Bộ phận Kỹ thuật triển khai dự án mới</td>
        </tr>
        
        <!-- Ngày Thứ Ba có cuộc họp đặc biệt kéo dài cả ngày hoặc nhiều giờ -> Dùng colspan="2" để minh họa sự kéo dài -->
        <tr>
            <td>Thứ Ba</td>
            <td colspan="2" style="background-color: #ffeaa7; font-weight: bold;">
                09:00 - 17:00: Hội nghị Khách hàng Toàn quốc (Kéo dài cả ngày)
            </td>
        </tr>

        <!-- Ngày Thứ Tư -->
        <tr>
            <td>Thứ Tư</td>
            <td>10:00 - 11:30</td>
            <td class="left-align">Đánh giá hiệu suất công việc tháng</td>
        </tr>
    </table>

</body>
</html>

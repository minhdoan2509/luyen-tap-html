<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Định kiểu Bảng nâng cao với CSS</title>
    <!-- Liên kết file CSS bên ngoài để định kiểu cho bảng -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Bảng Danh Sách Lớp Học</h2>

    <table>
        <!-- Hàng tiêu đề của bảng -->
        <tr>
            <th>Họ tên</th>
            <th>Tuổi</th>
            <th>Lớp</th>
        </tr>
        <!-- Hàng dữ liệu 1 -->
        <tr>
            <td>Nguyễn Văn A</td>
            <td>20</td>
            <td>Web</td>
        </tr>
        <!-- Hàng dữ liệu 2 -->
        <tr>
            <td>Trần Thị B</td>
            <td>21</td>
            <td>Web</td>
        </tr>
    </table>

</body>
</html>
